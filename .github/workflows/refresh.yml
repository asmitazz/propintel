name: Sersi daily refresh & deploy

# Runs the whole pipeline in the cloud each morning and publishes the report to
# GitHub Pages — a phone-reachable URL that updates itself (no Mac needed).
on:
  schedule:
    - cron: "0 21 * * *"      # 21:00 UTC ≈ 7:00am AEST (8:00am AEDT)
  workflow_dispatch:            # lets you run it on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline (ABS data + news + digest + report)
        run: |
          python -m propintel init-db
          python -m propintel analyze
          python -m propintel.news_feed || echo "news feed step soft-failed"
          python -m propintel.digest || true
          python -m propintel report

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp reports/emerging-growth-report.html _site/index.html
          cp -f manifest.json _site/manifest.json
          # also expose the raw daily update for quick reading
          cp -f data/latest_update.md _site/latest_update.md 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
